<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalOdds Pro - Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen flex flex-col p-4">

    <h2 class="text-lg font-bold mb-4">Meciuri de Azi</h2>
    <div id="status" class="text-xs text-brand-500 mb-3">Se încarcă...</div>
    <div id="list" class="space-y-3"></div>

    <script>
        const API_KEY = "9833b974a3e9b17e7226d0f74c53de92"; 
        const API_HOST = "v3.football.api-sports.io";
        
        async function test() {
            const status = document.getElementById('status');
            const list = document.getElementById('list');
            
            const today = new Date().toISOString().split('T')[0];

            try {
                const response = await fetch(`https://${API_HOST}/fixtures?date=${today}`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': API_KEY,
                        'x-rapidapi-host': API_HOST
                    }
                });
                
                const data = await response.json();
                
                if (data.errors && Object.keys(data.errors).length > 0) {
                    status.innerHTML = `Eroare API: ${JSON.stringify(data.errors)}`;
                    return;
                }

                const matches = data.response || [];
                status.innerHTML = `S-au găsit ${matches.length} meciuri în total azi.`;

                // Afișăm primele 10 meciuri, indiferent de ligă, ca să vedem că merge
                matches.slice(0, 10).forEach(m => {
                    list.innerHTML += `
                        <div class="bg-gray-800 p-3 rounded text-sm">
                            <div class="text-xs text-brand-500">${m.league.name} (${m.league.country})</div>
                            <div>${m.teams.home.name} vs ${m.teams.away.name}</div>
                        </div>
                    `;
                });

            } catch (error) {
                status.innerHTML = `Eroare de rețea (CORS): ${error.message}`;
            }
        }

        test();
    </script>
</body>
</html>
