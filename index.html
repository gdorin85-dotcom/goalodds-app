<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sparrow API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">
    <h1 class="text-xl font-bold mb-4">Test Statistici Meci</h1>
    <div id="result" class="text-sm bg-gray-800 p-4 rounded">Se încarcă...</div>

    <script>
        // CHEIA TA DE LA SPARROW API (RapidAPI)
        const API_KEY = "ce24597366msh6983057d71a3bc3p18791fjsn81a8dd98a1ca"; 
        const API_HOST = "football-soccer4.p.rapidapi.com";
        const MATCH_ID = "5795459"; // Fulham vs Man United

        async function getMatchStats() {
            const result = document.getElementById('result');
            
            try {
                const response = await fetch(`https://${API_HOST}/v1/statistics/match/${MATCH_ID}`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': API_KEY,
                        'x-rapidapi-host': API_HOST
                    }
                });

                const data = await response.json();
                result.innerText = JSON.stringify(data, null, 2);

            } catch (error) {
                result.innerText = "Eroare: " + error.message;
            }
        }

        getMatchStats();
    </script>
</body>
</html>
