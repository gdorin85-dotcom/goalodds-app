<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalOdds Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#10B981', 600: '#059669', dark: '#0B0F19', card: '#1E293B' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-dark text-gray-100 font-sans min-h-screen flex flex-col antialiased">

    <div id="main-app" class="flex flex-col flex-1 max-w-md mx-auto w-full pb-20">
        <header class="p-4 border-b border-gray-800 flex justify-between items-center bg-brand-dark/80 backdrop-blur sticky top-0 z-40">
            <div>
                <h2 class="text-lg font-bold">Meciuri Viitoare</h2>
                <p class="text-xs text-gray-400">Următoarele 7 zile • Ligi Principale</p>
            </div>
            <button onclick="loadMatches()" class="w-8 h-8 rounded-full bg-brand-500/20 text-brand-500 flex items-center justify-center hover:bg-brand-500/30 transition">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>
        </header>

        <main class="flex-1 p-4 overflow-y-auto">
            <div id="api-status" class="text-xs text-brand-500 px-1 mb-3"></div>
            <div id="matches-list" class="space-y-3"></div>
        </main>
    </div>

    <script>
        const API_KEY = "9833b974a3e9b17e7226d0f74c53de92"; 
        const API_HOST = "v3.football.api-sports.io";

        // ID-urile EXACTE și unice ale ligilor din API-Football
        const targetLeagueIds = [
            140, 141,             // Spania: La Liga, Segunda
            39, 40, 41, 42,       // Anglia: Premier League, Championship, League One, League Two
            78, 79,               // Germania: Bundesliga, 2. Bundesliga
            135, 136              // Italia: Serie A, Serie B
        ];

        async function loadMatches() {
            const statusEl = document.getElementById('api-status');
            const list = document.getElementById('matches-list');
            
            statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Se caută meciurile...';
            list.innerHTML = '';

            try {
                let allMatches = [];
                
                // Tragem meciurile pentru următoarele 7 zile
                for (let i = 0; i < 7; i++) {
                    const date = new Date();
                    date.setDate(date.getDate() + i);
                    const dateStr = date.toISOString().split('T')[0];

                    const response = await fetch(`https://${API_HOST}/fixtures?date=${dateStr}`, {
                        method: 'GET',
                        headers: {
                            'x-rapidapi-key': API_KEY,
                            'x-rapidapi-host': API_HOST
                        }
                    });
                    
                    const data = await response.json();
                    if (data.response) {
                        allMatches = allMatches.concat(data.response);
                    }
                }

                // FILTRAREA STRICTĂ: Doar după ID-ul ligii și statusul "Not Started"
                const filteredMatches = allMatches.filter(match => 
                    targetLeagueIds.includes(match.league.id) && 
                    match.fixture.status.short === 'NS'
                );

                if (filteredMatches.length > 0) {
                    statusEl.innerHTML = `<i class="fa-solid fa-check text-brand-500 mr-1"></i> ${filteredMatches.length} meciuri găsite.`;
                    
                    filteredMatches.sort((a, b) => new Date(a.fixture.date) - new Date(b.fixture.date));

                    filteredMatches.forEach(item => {
                        const homeName = item.teams.home.name;
                        const awayName = item.teams.away.name;
                        const leagueName = item.league.name;
                        const country = item.league.country;
                        
                        const matchDate = new Date(item.fixture.date);
                        const time = matchDate.toLocaleString('ro-RO', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

                        list.innerHTML += `
                            <div class="bg-brand-card p-4 rounded-xl border border-gray-800">
                                <div class="flex justify-between items-center text-xs text-gray-400 mb-2">
                                    <span class="text-brand-500 font-semibold truncate w-2/3">${leagueName} (${country})</span>
                                    <span>${time}</span>
                                </div>
                                <div class="flex justify-between items-center font-bold mb-3">
                                    <span class="flex-1 truncate pr-2">${homeName}</span>
                                    <span class="text-xs bg-gray-800 px-2 py-1 rounded text-gray-300 font-normal mx-2">VS</span>
                                    <span class="flex-1 truncate text-right pl-2">${awayName}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-info text-yellow-500 mr-1"></i> Nu sunt meciuri în ligile selectate în următoarele 7 zile.';
                }
            } catch (error) {
                statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500 mr-1"></i> Eroare: ${error.message}`;
            }
        }

        window.onload = loadMatches;
    </script>
</body>
</html>
