<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Final API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">
    <h1 class="text-xl font-bold mb-4">Test Endpoint Corect</h1>
    <div id="result" class="text-sm bg-gray-800 p-4 rounded whitespace-pre-wrap">Se încarcă...</div>

    <script>
        const API_KEY = "ce24597366msh6983057d71a3bc3p18791fjsn81a8dd98a1ca"; 
        const API_HOST = "football-soccer4.p.rapidapi.com";

        async function test() {
            const result = document.getElementById('result');
            // Endpoint-ul corect conform documentației: v1/matches-upcoming
            const url = `https://${API_HOST}/v1/matches-upcoming`;
            
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': API_KEY,
                        'x-rapidapi-host': API_HOST
                    }
                });

                const data = await response.json();
                result.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                result.innerText = "Eroare: " + error.message;
            }
        }

        test();
    </script>
</body>
</html>
